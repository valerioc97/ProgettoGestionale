# Spring Boot application configuration

# Server configuration
server:
  port: 8081

# Database configuration
spring:
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: my-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.lavanderia.ProgettoGestionale.model.dto
        spring.json.value.default.type: com.lavanderia.ProgettoGestionale.model.dto.ClienteDto
    listener:
      missing-topics-fatal: false
  datasource:
    url: jdbc:mysql://localhost:3306/lavanderia
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

# Logging configuration
logging:
  level:
    root: INFO
    com.example: DEBUG

# Custom application properties
custom:
  app:
    name: Lavanderia Maione
    version: 1.0
    description: Gestionale della lavanderia Maione
